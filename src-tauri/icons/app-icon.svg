<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- 素纸底 + 极淡描边（白底也能看清边缘） -->
  <rect x="112" y="112" width="800" height="800" rx="196" fill="#FAF7F0" stroke="#E7E1D4" stroke-width="4"/>
  <!-- 衬线字标「Sū」墨字 -->
  <text x="455" y="672" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="400" fill="#1E1B17">Sū</text>
  <!-- 朱砂红点作为「·」 -->
  <circle cx="768" cy="644" r="30" fill="#B23A2E"/>
</svg>
